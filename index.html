<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sistema Acadêmico de Gestão de Alunos e Desempenho — Faculdade Horizonte do Saber (protótipo acadêmico, dados fictícios).">
  <meta name="color-scheme" content="light">
  <title>Sistema Acadêmico — Faculdade Horizonte do Saber</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- defer: os scripts não bloqueiam a renderização; executam em ordem após o HTML ser lido -->
  <script defer src="js/seed-fallback.js"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/auth.js"></script>
  <script defer src="js/storage.js"></script>
  <script defer src="js/validators.js"></script>
  <script defer src="js/rules.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/crud.js"></script>
  <script defer src="js/views/login.js"></script>
  <script defer src="js/views/painel.js"></script>
  <script defer src="js/views/alunos.js"></script>
  <script defer src="js/views/cursos.js"></script>
  <script defer src="js/views/disciplinas.js"></script>
  <script defer src="js/views/matriculas.js"></script>
  <script defer src="js/views/lancamentos.js"></script>
  <script defer src="js/views/boletim.js"></script>
  <script defer src="js/views/auditoria.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a href="#conteudo" class="sr-only focus:not-sr-only focus:fixed focus:left-2 focus:top-2 focus:z-50 focus:rounded-lg focus:bg-white focus:px-4 focus:py-2 focus:font-semibold focus:text-brand-900"
     onclick="document.getElementById('conteudo').focus();">Ir para o conteúdo principal</a>

  <noscript>
    <p class="p-6 text-center font-semibold">Este sistema precisa de JavaScript habilitado para funcionar.</p>
  </noscript>

  <div id="carregando" class="flex min-h-screen items-center justify-center text-slate-700" role="status">Carregando sistema…</div>

  <div id="tela-login" hidden></div>

  <div id="tela-app" hidden>
    <header class="bg-brand-900 text-white">
      <div class="mx-auto flex max-w-7xl flex-wrap items-center justify-between gap-3 px-4 py-3">
        <div>
          <p class="text-xs font-semibold uppercase tracking-widest text-brand-100">Faculdade Horizonte do Saber</p>
          <p class="text-lg font-bold">Sistema Acadêmico</p>
        </div>
        <div class="flex items-center gap-3">
          <p class="text-right text-sm leading-tight">
            <span id="usuario-nome" class="block font-semibold"></span>
            <span id="usuario-perfil" class="block text-xs text-brand-100"></span>
          </p>
          <button type="button" id="btn-sair" class="rounded-lg border border-white/60 px-3 py-1.5 text-sm font-semibold hover:bg-white/15">Sair</button>
        </div>
      </div>
      <nav aria-label="Menu principal" class="bg-brand-800">
        <div class="mx-auto max-w-7xl px-4 py-2">
          <button type="button" id="btn-menu" class="rounded-lg border border-white/60 px-3 py-1.5 text-sm font-semibold md:hidden" aria-expanded="false" aria-controls="menu-lista">☰ Menu</button>
          <ul id="menu-lista" class="mt-2 hidden flex-col gap-1 md:mt-0 md:flex md:flex-row md:flex-wrap"></ul>
        </div>
      </nav>
    </header>

    <main id="conteudo" tabindex="-1" class="mx-auto max-w-7xl px-4 pb-16 pt-6">
      <div id="view"></div>
    </main>

  </div>

  <div id="toasts" class="pointer-events-none fixed bottom-4 right-4 z-50 flex w-[22rem] max-w-[calc(100vw-2rem)] flex-col gap-2" aria-live="polite" aria-atomic="false"></div>
</body>
</html>
